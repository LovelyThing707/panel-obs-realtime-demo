<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <!-- No maximum-scale: pinch-zoom stays enabled (WCAG 1.4.4). The 17px input
       font already prevents iOS focus-zoom, so we don't need to lock scale. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1419" />
  <title>操作パネル — Panel → OBS</title>
  <link rel="stylesheet" href="/panel.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">PANEL</span>
        <span class="brand-sub">broadcast control</span>
      </div>
      <div class="room">
        <span class="room-label">ROOM</span>
        <span class="room-code" id="roomCode">----</span>
      </div>
      <div class="status" role="status" aria-live="polite">
        <span class="pill" id="wsPill" data-state="connecting">
          <span class="dot"></span><span class="pill-text">接続中</span>
        </span>
        <span class="pill" id="obsPill" data-state="off">
          <span class="dot"></span><span class="pill-text">OBS 未接続</span>
        </span>
      </div>
    </header>

    <main class="main">
      <!-- Signature element: the live latency readout (CLAUDE.md §6) -->
      <section class="telemetry" id="telemetry" aria-live="polite">
        <div class="tally" id="tally" aria-hidden="true"></div>
        <div class="readout">
          <div class="readout-label">反映速度</div>
          <div class="readout-value">
            <span id="latencyValue" class="num">--</span><span class="unit">ms</span>
          </div>
          <div class="readout-caption" id="latencyCaption">操作すると反映までの時間を表示します</div>
        </div>
        <div class="telemetry-meta">
          <div class="meta-row"><span>最小</span><b id="latencyMin">--</b></div>
          <div class="meta-row"><span>直近</span><b id="latencyLast">--</b></div>
          <div class="spark" id="spark" aria-hidden="true"></div>
        </div>
      </section>

      <section class="strip">
        <div class="strip-head"><span class="idx">01</span><span>お題テキスト</span></div>
        <div class="strip-body">
          <input
            id="textInput"
            class="text-input"
            type="text"
            inputmode="text"
            maxlength="200"
            placeholder="オーバーレイに表示するテキスト"
            autocomplete="off"
            aria-label="お題テキスト"
          />
          <button id="textBtn" class="btn btn-fire">反映</button>
        </div>
      </section>

      <section class="strip">
        <div class="strip-head"><span class="idx">02</span><span>サンプル演出</span></div>
        <div class="strip-body">
          <button id="effectBtn" class="btn btn-fire btn-wide">演出を出す</button>
        </div>
      </section>

      <section class="strip">
        <div class="strip-head"><span class="idx">03</span><span>表示</span></div>
        <div class="strip-body">
          <div class="segment" role="group" aria-label="オーバーレイ表示">
            <button id="showBtn" class="seg" aria-pressed="true">ON</button>
            <button id="hideBtn" class="seg" aria-pressed="false">OFF</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <button id="copyOverlay" class="btn btn-ghost">オーバーレイURLをコピー</button>
      <span class="footer-hint" id="copyHint"></span>
    </footer>
  </div>

  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <script src="/ably-client.js"></script>
  <script src="/panel.js"></script>
</body>
</html>
