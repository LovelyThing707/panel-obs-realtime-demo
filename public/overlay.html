<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay — Panel → OBS</title>
  <link rel="stylesheet" href="/overlay.css" />
</head>
<body>
  <!-- 1920×1080 stage. body stays transparent for OBS Browser Source;
       ?preview=1 paints a dark backdrop so it can be checked in a browser. -->
  <div class="stage" id="stage">

    <!-- Persistent お題 display (lower third) -->
    <div class="title-card" id="titleCard" data-empty="true" aria-hidden="true">
      <span class="title-eyebrow">お題</span>
      <span class="title-text" id="titleText"></span>
    </div>

    <!-- Transient generic notification cards mount here -->
    <div class="toast-layer" id="toastLayer" aria-hidden="true"></div>

    <!-- Preview-only heads-up (hidden in OBS) -->
    <div class="preview-hud" id="previewHud">
      <span class="preview-tag">PREVIEW</span>
      <span id="previewRoom">room ----</span>
      <span id="previewConn">…</span>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script src="/overlay.js"></script>
</body>
</html>
